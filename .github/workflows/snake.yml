name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vaibhavv-labs
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23B8DDF5&color_dots=%230B1F3A,%23102C50,%23173E68,%235B9BD5,%23D9EEFF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
