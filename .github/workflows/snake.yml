
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: vaibhavv-labs
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23EF93C4&color_dots=%23FCE4EC,%23F8BBD0,%23F48FB1,%23EF93C4,%23D16BA5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
