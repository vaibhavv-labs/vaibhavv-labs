name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Icy Blue Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vaibhavv-labs
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B8DDF5&color_dots=%230D1117,%230D1117,%230D1117,%230D1117,%230D1117

      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
